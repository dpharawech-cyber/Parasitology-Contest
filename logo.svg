<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Parasitology Contest logo">
  <defs>
    <radialGradient id="field" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FFF4F8"/>
      <stop offset=".6" stop-color="#F7D3E0"/>
      <stop offset="1" stop-color="#E9A9C0"/>
    </radialGradient>
    <linearGradient id="worm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C6FD6"/>
      <stop offset="1" stop-color="#23397F"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="256" cy="256" r="206"/></clipPath>
  </defs>

  <!-- objective barrel -->
  <circle cx="256" cy="256" r="246" fill="#18203A"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#B8335F" stroke-width="8"/>
  <!-- reticle ticks -->
  <g stroke="#E7EAF2" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="18" x2="256" y2="40"/>
    <line x1="256" y1="472" x2="256" y2="494"/>
    <line x1="18" y1="256" x2="40" y2="256"/>
    <line x1="472" y1="256" x2="494" y2="256"/>
  </g>

  <!-- Giemsa-stained field -->
  <circle cx="256" cy="256" r="206" fill="url(#field)"/>
  <g clip-path="url(#lens)">
    <!-- red cells -->
    <g fill="#EFB3C8" stroke="#D98BA8" stroke-width="3">
      <circle cx="120" cy="140" r="38"/><circle cx="392" cy="380" r="40"/>
      <circle cx="112" cy="392" r="34"/><circle cx="410" cy="150" r="30"/>
      <circle cx="200" cy="452" r="32"/>
    </g>
    <g fill="#F9DCE6">
      <circle cx="120" cy="140" r="15"/><circle cx="392" cy="380" r="16"/>
      <circle cx="112" cy="392" r="13"/><circle cx="410" cy="150" r="12"/>
      <circle cx="200" cy="452" r="12"/>
    </g>
    <!-- ring form with chromatin dot, a nod to P. falciparum -->
    <circle cx="410" cy="150" r="9" fill="none" stroke="#2C4DA3" stroke-width="3"/>
    <circle cx="417" cy="143" r="4" fill="#B8335F"/>
  </g>

  <!-- the worm, coiled into a P -->
  <path d="M206 408 L206 176 Q206 126 262 124 Q336 122 338 188 Q340 256 262 258 L236 258"
        fill="none" stroke="url(#worm)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tapering tail -->
  <path d="M183 404 Q206 470 229 404 Z" fill="#23397F"/>
  <!-- head, mouth and nuclei -->
  <circle cx="236" cy="258" r="6" fill="#FFF4F8"/>
  <g fill="#9FB4F2">
    <circle cx="206" cy="210" r="5"/><circle cx="206" cy="250" r="5"/><circle cx="206" cy="290" r="5"/>
    <circle cx="206" cy="330" r="5"/><circle cx="206" cy="370" r="5"/>
    <circle cx="300" cy="140" r="5"/><circle cx="322" cy="178" r="5"/><circle cx="316" cy="222" r="5"/>
  </g>

  <!-- operculated egg -->
  <g transform="rotate(-28 330 356)">
    <ellipse cx="330" cy="356" rx="46" ry="30" fill="#E3A93C" stroke="#8A5A10" stroke-width="6"/>
    <path d="M364 336 Q380 356 364 376" fill="none" stroke="#8A5A10" stroke-width="6" stroke-linecap="round"/>
    <circle cx="316" cy="352" r="7" fill="#8A5A10" opacity=".55"/>
    <circle cx="336" cy="362" r="6" fill="#8A5A10" opacity=".55"/>
    <circle cx="324" cy="370" r="5" fill="#8A5A10" opacity=".55"/>
  </g>
</svg>
